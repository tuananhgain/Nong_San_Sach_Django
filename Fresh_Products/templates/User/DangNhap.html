<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width: 600px; margin-top: 50px;">
        <h2 class="text-center">Đăng nhập</h2>

        <form method="post" action="{% url 'dangnhap' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Tài khoản:</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu:</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
        </form>

        <!-- Hiển thị thông báo lỗi -->
        {% if messages %}
            {% for message in messages %}
                {% if message.tags == "error" %}
                    <div id="error-message" class="alert alert-danger mt-3">
                        {{ message }}
                    </div>
                {% endif %}
            {% endfor %}
            <script>
                setTimeout(function () {
                    var errorMessage = document.getElementById("error-message");
                    if (errorMessage) {
                        errorMessage.style.display = "none";
                    }
                }, 2000);
            </script>
        {% endif %}

        <div class="d-flex justify-content-between mt-3">
            <a href="{% url 'dangky' %}" class="link link-warning">Đăng ký</a>
            <a href="#" class="link link-warning">Quên mật khẩu</a>
            <a href="{% url 'index' %}" class="link link-secondary">Quay về trang chủ</a>
        </div>
    </div>
</body>
</html>
