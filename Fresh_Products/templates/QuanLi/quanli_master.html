{% load static %}
{% load bootstrap5 %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Quản lý Nông sản{% endblock %}</title>
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <link rel="stylesheet" href="{% static 'quanli.css' %}">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="nav-sidebar d-flex flex-column flex-shrink-0 p-3 bg-success text-white">
            <h4 class="mb-4 text-center fw-bold">QUẢN LÍ NÔNG SẢN</h4>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item mb-2 {% if request.resolver_match.url_name == 'quanli_index' %}active{% endif %}">
                    <a class="nav-link text-white {% if request.resolver_match.url_name == 'quanli_index' %}active-link{% endif %}" href="{% url 'quanli_index' %}">
                        <i class="bi bi-bag"></i> Đơn Hàng
                    </a>
                </li>
                <li class="nav-item mb-2 {% if request.resolver_match.url_name == 'khuyenmai_quanli' %}active{% endif %}">
                    <a class="nav-link text-white {% if request.resolver_match.url_name == 'khuyenmai_quanli' %}active-link{% endif %}" href="{% url 'khuyenmai_quanli' %}">
                        <i class="bi bi-percent"></i> Khuyến Mãi
                    </a>
                </li>
                <li class="nav-item mb-2 {% if request.resolver_match.url_name == 'ThongKeHD_QL' %}active{% endif %}">
                    <a class="nav-link text-white {% if request.resolver_match.url_name == 'ThongKeHD_QL' %}active-link{% endif %}" href="{% url 'ThongKeHD_QL' %}">
                        <i class="bi bi-bar-chart"></i> Thống kê
                    </a>
                </li>
                <li class="nav-item mb-2 {% if request.resolver_match.url_name == 'dangxuat' %}active{% endif %}">
                    <a class="nav-link text-white {% if request.resolver_match.url_name == 'dangxuat' %}active-link{% endif %}" href="{% url 'dangxuat' %}">
                        <i class="bi bi-box-arrow-right"></i> Đăng xuất
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="main-content flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer text-center py-3 bg-light mt-4 border-top">
        &copy; 2025 Nông Sản Sạch. All rights reserved.
    </footer>
</body>
</html>
